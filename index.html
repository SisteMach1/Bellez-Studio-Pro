<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belleza Studio Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff5f7}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff}
.logo{display:flex;gap:10px;align-items:center}
.logo b{width:42px;height:42px;background:#ff1a7a;border-radius:12px;display:grid;place-items:center;color:#fff}
.hero{margin:12px;background:linear-gradient(135deg,#ff8ab5,#ff1a7a);border-radius:28px;padding:20px;color:#fff}
.hero h2{font-size:36px;line-height:.9;margin:12px 0}
.actions{display:flex;gap:10px;margin:14px 0 20px}
.actions button{flex:1;border:0;padding:12px;border-radius:20px;font-weight:800}
.btn-white{background:#fff;color:#000}
.btn-dark{background:#00000033;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#fff;border-radius:18px;padding:14px 10px;min-width:0;overflow:hidden}
.stat small{display:block;font-size:9px;letter-spacing:1px;color:#999;font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:clamp(12px,3.5vw,17px);color:#111;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
</style>
</head>
<body>
<div class="top"><div class="logo"><b>B</b><div><div style="font-weight:800">Belleza Studio Pro</div><small style="color:#999;letter-spacing:2px">MAGENTA • PRO</small></div></div></div>
<div class="hero">
<div style="font-size:11px;letter-spacing:2px;opacity:.9">HOY • MARTES, 8 DE SEPTIEMBRE</div>
<h2>Tu salón,<br>elevado a lujo.</h2>
<p style="font-size:13px;opacity:.9">Magenta sofisticado. Gestión impecable.</p>
<div class="actions"><button class="btn-white">+ Nueva clienta</button><button class="btn-dark">Ver catálogo</button></div>
<div class="stats">
<div class="stat"><small>DEUDA TOTAL</small><b>$18.000</b></div>
<div class="stat"><small>INGRESO MES</small><b>$67.528</b></div>
<div class="stat"><small>CLIENTES HOY</small><b>1</b></div>
</div>
</div>
</body>
</html>
