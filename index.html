<title>Belleza Studio Pro - MAGENTA PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#fff5f7;min-height:100vh;padding-bottom:90px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:44px;height:44px;background:#ff1a7a;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-style:normal;font-size:20px}
.logo b{font-size:18px} .logo small{display:block;color:#999;letter-spacing:2px;font-size:11px;font-weight:600}
.hero{background:linear-gradient(135deg,#ff7aad 0%,#ff4d8f 45%,#ff1a7a 100%);margin:12px;border-radius:32px;padding:22px 20px;color:#fff}
.hero .date{font-size:12px;letter-spacing:3px;opacity:.9;margin-bottom:14px;text-transform:uppercase}
.hero h2{font-size:38px;line-height:.95;font-weight:800;margin-bottom:12px;letter-spacing:-1px}
.hero p{font-size:14px;opacity:.9;line-height:1.4;max-width:240px;margin-bottom:20px}
.actions{display:flex;gap:10px;margin-bottom:22px}
.actions button{flex:1;border:0;padding:13px 10px;border-radius:22px;font-weight:800;font-size:14px;cursor:pointer}
.btn-white{background:#fff;color:#111}
.btn-rose{background:#00000026;color:#fff;backdrop-filter:blur(10px)}

/* === ACA ESTABA EL ERROR - AHORA SI ENTRAN LOS NUMEROS === */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:#fff;border-radius:20px;padding:14px 12px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 20px #00000012}
.card span{font-size:10px;letter-spacing:1.2px;color:#999;font-weight:700;line-height:1.2}
.card b{font-size:clamp(13px, 3.8vw, 18px);font-weight:900;color:#111;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;letter-spacing:-0.5px}
